<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#000">
  <title>gate 05</title>
  <link rel="icon" type="image/svg+xml" href="/assets/wired-sigil.svg">
  <link rel="stylesheet" href="/style.css?v=wired-31">
  <script src="/wired-state.js?v=31" defer></script>
  <script src="/sigil.js?v=31" defer></script>
  <script src="/wired.js?v=31" defer></script>
  <script src="/crt.js?v=31" defer></script>
</head>
<body>
  <svg class="svg-filters" width="0" height="0" aria-hidden="true" focusable="false">
    <defs><filter id="onebit" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
      <!-- Lift the original dark photograph before the five-level quantization. -->
      <feComponentTransfer>
        <feFuncR type="linear" slope="2.2"/>
        <feFuncG type="linear" slope="2.2"/>
        <feFuncB type="linear" slope="2.2"/>
      </feComponentTransfer>
      <feComponentTransfer>
        <feFuncR type="discrete" tableValues="0 0 .35 .8 1"/>
        <feFuncG type="discrete" tableValues="0 0 .35 .8 1"/>
        <feFuncB type="discrete" tableValues="0 0 .35 .8 1"/>
      </feComponentTransfer>
    </filter></defs>
  </svg>
  <a class="skip" href="#main">ir al contenido</a>
  <main id="main" tabindex="-1">
    <div id="screen">
      <div id="content"></div>
      <div id="navigation" hidden></div>
      <aside id="activity" aria-label="registro de actividad"></aside>
      <footer id="footer"></footer>
    </div>
  </main>
  <div class="texture" aria-hidden="true"></div>
  <div class="scan" aria-hidden="true"></div>
  <div class="crt-bars" aria-hidden="true"><span class="bar-top"></span><span class="bar-bottom"></span><span class="bar-roll"></span></div>
</body>
</html>
